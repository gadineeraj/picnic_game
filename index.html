<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Can I bring it?</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#f6f1e7; --card:#fffdf8; --ink:#241f1a; --muted:#7a6f61;
    --line:#e2d8c6; --yes:#1f7a4d; --yes-bg:#e4f3ea; --no:#a8322b; --no-bg:#fbe8e6;
    --accent:#8a6d3b;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15130f; --card:#1e1b16; --ink:#f1ebdf; --muted:#a2978a;
      --line:#332d24; --yes:#7ad3a0; --yes-bg:#16301f; --no:#f19189; --no-bg:#331916;
      --accent:#d9b981;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;
    padding:24px 16px 64px;
  }
  .wrap{max-width:680px;margin:0 auto}
  h1{font-size:28px;margin:0 0 6px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px;margin:0}
  [hidden]{display:none !important}

  /* ---- home ---- */
  #home header{text-align:center;margin-bottom:26px}
  .plays{display:grid;gap:12px}
  .play{
    display:block;width:100%;text-align:left;padding:20px;border-radius:16px;
    border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
  }
  .play:hover{border-color:var(--accent)}
  .play .tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .play .name{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px}
  .play .desc{font-size:14px;color:var(--muted);line-height:1.45}
  .play .go{margin-top:12px;font-size:13px;color:var(--accent);font-weight:600}

  /* ---- game ---- */
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .back{background:none;border:none;color:var(--muted);font-size:15px;padding:8px 6px 8px 0;cursor:pointer}
  .tabs{display:flex;gap:4px;padding:4px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;margin-left:auto}
  .tab{border:none;background:none;color:var(--muted);font-size:13.5px;font-weight:600;padding:7px 13px;border-radius:9px;cursor:pointer}
  .tab[aria-selected=true]{background:var(--ink);color:var(--bg)}
  #gameHead{margin-bottom:18px}
  #gameHead h1{font-size:24px}

  form{display:flex;gap:8px;margin:0 0 16px}
  input[type=text]{
    flex:1;min-width:0;padding:14px 16px;font-size:17px;
    border:1.5px solid var(--line);border-radius:12px;
    background:var(--card);color:var(--ink);
  }
  input[type=text]:focus{outline:none;border-color:var(--accent)}
  button{
    font:inherit;cursor:pointer;border-radius:12px;border:1.5px solid var(--line);
    background:var(--card);color:var(--ink);padding:14px 18px;
  }
  button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
  button:active{transform:translateY(1px)}

  .verdict{
    border-radius:16px;padding:22px 20px;text-align:center;margin-bottom:22px;
    border:1.5px solid var(--line);background:var(--card);
    min-height:104px;display:flex;flex-direction:column;justify-content:center;gap:6px;
  }
  .verdict.yes{background:var(--yes-bg);border-color:var(--yes)}
  .verdict.no{background:var(--no-bg);border-color:var(--no)}
  .verdict .big{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .verdict.yes .big{color:var(--yes)}
  .verdict.no .big{color:var(--no)}
  .verdict .line{font-size:16px}
  .verdict .idle{color:var(--muted);font-size:15px}
  .split{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;color:var(--muted);letter-spacing:.02em}
  .split b{color:var(--ink);font-weight:600}
  .split .bad{color:var(--no);font-weight:700}
  .pop{animation:pop .22s ease-out}
  @keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:scale(1);opacity:1}}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .col{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
  .col h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;margin:0 0 10px;color:var(--muted)}
  .col.y h2{color:var(--yes)} .col.n h2{color:var(--no)}
  ul{list-style:none;margin:0;padding:0}
  li{padding:5px 0;border-bottom:1px dashed var(--line);word-break:break-word}
  li:last-child{border-bottom:0}
  li .how{display:block;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--muted);line-height:1.45}
  li .how .bad{color:var(--no)}
  .empty{color:var(--muted);font-size:14px;font-style:italic}

  footer{margin-top:28px;text-align:center}
  .ghost{background:none;border:none;color:var(--muted);font-size:13px;padding:6px 10px;text-decoration:underline;cursor:pointer}

  dialog{
    border:1.5px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);
    max-width:560px;width:calc(100% - 32px);padding:20px;max-height:86vh;
  }
  dialog::backdrop{background:rgba(0,0,0,.45)}
  dialog h3{margin:0 0 4px;font-size:18px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
  .row:last-of-type{border-bottom:0}
  .row small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
  .spoiler{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;font-size:14.5px}
  .spoiler ol{margin:8px 0 0;padding-left:20px} .spoiler li{border:0;padding:3px 0}
  .sw{position:relative;width:46px;height:26px;flex:0 0 auto}
  .sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
  .sw span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.15s;pointer-events:none}
  .sw span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--card);transition:.15s}
  .sw input:checked + span{background:var(--yes)}
  .sw input:checked + span::after{transform:translateX(20px)}
  .row.stack{flex-direction:column;align-items:stretch}
  select{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);
    background:var(--card);color:var(--ink);width:100%;margin-top:9px}
  .btnrow{display:flex;gap:8px;margin-top:16px}
  .btnrow button{flex:1;padding:11px}

  .ptable{display:flex;flex-wrap:wrap;gap:5px;max-height:250px;overflow-y:auto;margin-top:10px;
    background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
  .el{border:1px solid var(--line);border-radius:7px;padding:4px 6px;min-width:52px;background:var(--card)}
  .el b{display:block;font-size:14px;line-height:1.15}
  .el i{display:block;font-style:normal;font-size:9px;color:var(--muted);line-height:1.2}
  .el .z{font-size:9px;color:var(--muted)}
  .el.one{border-color:var(--accent)}
  .lookup{width:100%;margin-top:10px;padding:10px 12px;font-size:15px;border:1.5px solid var(--line);
    border-radius:10px;background:var(--card);color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 12px}
  .chip{font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:3px 7px;border-radius:6px;
    border:1px solid var(--line);background:var(--card)}
  .chip.y{border-color:var(--yes);color:var(--yes)}
  .chip.n{border-color:var(--no);color:var(--no)}
</style>
</head>
<body>

<!-- ================= HOME ================= -->
<div class="wrap" id="home">
  <header>
    <h1>Can I bring it?</h1>
    <p class="sub">Two rounds. Same picnic. Completely different rules.</p>
  </header>
  <div class="plays" id="playCards"></div>
  <footer><span class="sub">Pick a round to start. Each keeps its own board.</span></footer>
</div>

<!-- ================= GAME ================= -->
<div class="wrap" id="game" hidden>
  <div class="topbar">
    <button class="back" id="backBtn" type="button">&larr; rounds</button>
    <div class="tabs" id="tabs" role="tablist"></div>
  </div>

  <div id="gameHead">
    <h1 id="gTitle"></h1>
    <p class="sub" id="gSub"></p>
  </div>

  <form id="f" autocomplete="off">
    <input id="q" type="text" autocapitalize="none" spellcheck="false" maxlength="60">
    <button class="primary" type="submit">Ask</button>
  </form>

  <div class="verdict" id="verdict"><div class="idle">Nothing asked yet.</div></div>

  <div class="cols">
    <div class="col y">
      <h2>You <em>can</em> bring <span id="cy"></span></h2>
      <ul id="listY"></ul>
    </div>
    <div class="col n">
      <h2>You <em>can't</em> bring <span id="cn"></span></h2>
      <ul id="listN"></ul>
    </div>
  </div>

  <footer><button class="ghost" id="hostBtn" type="button">host</button></footer>
</div>

<dialog id="hostPanel">
  <h3>Host panel <span class="sub" id="hpWhich"></span></h3>
  <p class="sub" style="margin:0 0 10px">Players: turn back now.</p>

  <div class="row">
    <div><strong>Show workings</strong><small id="showDesc"></small></div>
    <label class="sw"><input type="checkbox" id="optShow"><span></span></label>
  </div>
  <div class="row">
    <div><strong>Hard mode</strong><small id="hardDesc"></small></div>
    <label class="sw"><input type="checkbox" id="optHard"><span></span></label>
  </div>
  <div class="row stack">
    <div><strong>Opening board</strong><small id="seedDesc"></small></div>
    <select id="optSeed"></select>
  </div>

  <div class="btnrow">
    <button type="button" id="revealBtn">Reveal rule &amp; hints</button>
    <button type="button" id="resetBtn">Clear board</button>
  </div>
  <div id="spoiler" class="spoiler" hidden></div>
  <div class="btnrow"><button type="button" id="closeBtn" class="primary">Close</button></div>
</dialog>

<script>
(function(){
  "use strict";
  // Nothing to see here. Go play the game.

  // apostrophes, digits. This is what makes "a knife" differ from "knife".

    if (s.normalize) s = s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    return s.replace(/[^a-z]/g, "");
  }

     ROUND ONE

  var ELS = DATA.split(",").map(function(p, i){
    var b = p.split(":"); return { z:i+1, sym:b[0], name:b[1] };
  });
  var SET = {}, INFO = {};
  ELS.forEach(function(e){ SET[e.sym.toLowerCase()] = e.sym; INFO[e.sym] = e; });

  // Walk the word position by position, trying the two-letter piece and the
  // one-letter piece and recursing. Dead ends backtrack, so the search is
  // complete: if any way through exists this finds it. reach[i] is computed
  // right to left and says "the rest of the word works out from here".
  function analyse(word, hard){
    var n = word.length;
    if (!n) return null;
    var reach = new Array(n+1).fill(false), ways = new Array(n+1).fill(0);
    reach[n] = true; ways[n] = 1;
    for (var i = n-1; i >= 0; i--)
      for (var len = 1; len <= 2; len++){
        if (i+len > n || !SET[word.substr(i,len)]) continue;
        if (reach[i+len]){ reach[i] = true; ways[i] += ways[i+len]; }
      }
    var fwd = new Array(n+1).fill(false); fwd[0] = true; var stuck = 0;
    for (var j = 0; j <= n; j++){
      if (!fwd[j]) continue;
      stuck = Math.max(stuck, j);
      for (var l = 1; l <= 2; l++)
        if (j+l <= n && SET[word.substr(j,l)]) fwd[j+l] = true;
    }
    // Enumerate the ways through. Only descends where reach says the rest
    // works out, so it never wastes time down a doomed branch.
    var CAP = 40, splits = [];
    (function walk(i, acc){
      if (splits.length >= CAP) return;
      if (i === n){ splits.push(acc.slice()); return; }
      for (var len = 1; len <= 2; len++){
        if (i+len > n) continue;
        var sym = SET[word.substr(i,len)];
        if (!sym || !reach[i+len]) continue;
        acc.push(sym); walk(i+len, acc); acc.pop();
      }
    })(0, []);
    var withTwo = splits.filter(function(s){ return s.some(function(x){ return x.length === 2; }); });
    return {
      ok: hard ? withTwo.length > 0 : reach[0],
      splits: hard ? withTwo : splits,
      ways: ways[0],
      stuck: word.slice(0, stuck),
      rest: word.slice(stuck)
    };
  }

  function elWorkings(a, full){
    if (a.ok){
      var take = full ? 6 : 2;
      var lines = a.splits.slice(0, take).map(function(s){ return esc(s.join("·")); });
      var more = a.ways - Math.min(a.splits.length, take);
      var head = "<b>" + lines[0] + "</b>" + (lines.length > 1 ? " / " + lines.slice(1).join(" / ") : "") +
                 (more > 0 ? " +" + more + " more" : "");
      if (full && a.splits.length)
        head += "<br>" + esc(a.splits[0].map(function(s){
          return INFO[s].sym + " " + INFO[s].name.toLowerCase() + " " + INFO[s].z; }).join(", "));
      return head;
    }
    return a.stuck ? 'dead end: ' + esc(a.stuck) + ' &rarr; <span class="bad">' + esc(a.rest) + "</span>"
                   : '<span class="bad">dead end at the first letter</span>';
  }

  /* =================================================================
     ROUND TWO
     ================================================================= */
  // Walk left to right and ask "did I go backwards?". That is the whole job.
  function alpha(word, hard){
    var n = word.length;
    if (!n) return null;
    for (var i = 1; i < n; i++){
      if (word[i] < word[i-1]) return { ok:false, at:i, why:"back", word:word };
      if (hard && word[i] === word[i-1]) return { ok:false, at:i, why:"repeat", word:word };
    }
    return { ok:true, at:-1, word:word };
  }

  function alphaWorkings(a, full, hard){
    var w = a.word, sep = hard ? " < " : " ≤ ";
    if (a.ok) return "<b>" + w.split("").join(sep) + "</b>";
    var head = w.slice(0, a.at).split("").join(sep);
    var tail = '<span class="bad">' + esc(w[a.at]) + "</span>";
    var out = (head ? head + " " : "") + '<span class="bad">✗</span> ' + tail;
    if (full)
      out += "<br>" + (a.why === "repeat"
        ? '"' + esc(w[a.at]) + '" repeats at letter ' + (a.at+1)
        : '"' + esc(w[a.at]) + '" comes before "' + esc(w[a.at-1]) + '" at letter ' + (a.at+1));
    return out;
  }

  /* =================================================================
     THE TWO ROUNDS
     ================================================================= */
  var PLAYS = [
    {
      id: "p1",
      tab: "Play 1",
      name: "Round one",
      blurb: "The first round. Deny fast, allow bacon, and let them chase the wrong theory.",
      sub: "Type what you'd like to bring to the picnic. I'll tell you yes or no.",
      ph: "a sandwich…",
      hardDesc: "Also requires at least one two-letter piece. Kills sun, bus, fun, chip — words built only from single letters. Bacon, knife, spoon and picnic all survive.",

      seeds: [

        { id:"dec",  label:"carbon · silicon · iron", words:["carbon","silicon","iron"] }
      ],
      seedDefault: "dec",
      seedDesc: "Three items that all pass, and all point at the wrong theory.",
      judge: function(w, hard){ return analyse(w, hard); },
      workings: function(a, full){ return elWorkings(a, full); },
      rule: "WW91IGNhbiBicmluZyBpdCBpZiB0aGUgd2hvbGUgd29yZCBjYW4gYmUgc3BlbGxlZCB1c2luZyBvbmx5IGNoZW1pY2FsIGVsZW1lbnQgc3ltYm9scy4gQkFDT04gPSBCYSArIEMgKyBPICsgTi4gS05JRkUgPSBLICsgTmkgKyBGZS4gQW5kIHRoZSByZXZlYWw6IFBJQ05JQyA9IFAgKyBJICsgQyArIE5pICsgQy4=",
      hints: "QWxsb3cgQkFDT04gdW5wcm9tcHRlZCwgcmlnaHQgYWZ0ZXIgZGVueWluZyBPWFlHRU4uIFNheSBub3RoaW5nIGVsc2UufE5vYm9keSBoYXMgYXNrZWQgd2hhdCB0aGUgd29yZHMgYXJlIE1BREUgT0YufEFsbG93IEtOSUZFIGFuZCBXQVRFUiB0byB3aG9ldmVyIGlzIHN0dWNrIC0gYnJlYWtzIHRoZSBmb29kIHRoZW9yeSBhbmQgdGhlIHNwZWxsaW5nIHRoZW9yaWVzIGF0IG9uY2UufEV2ZXJ5dGhpbmcgSSBoYXZlIGFsbG93ZWQsIEkgY291bGQgd3JpdGUgZG93biBpbiBhYm91dCBmb3VyIHBpZWNlcy58RW5kZ2FtZTogSSBhbSBicmluZ2luZyBhIHBpY25pYyB0byB0aGUgcGljbmljLg==",
      reference: function(){
        var ones = ELS.filter(function(e){ return e.sym.length === 1; }).length;
        return "<strong>The reference set</strong> — all " + ELS.length + " elements, " + ones +
          " single-letter (outlined), " + (ELS.length-ones) + " double. Nothing else is consulted; " +
          "there is no word list." +
          '<input class="lookup" id="lookup" placeholder="filter: fe, iron, 26…">' +
          '<div class="ptable" id="ptable"></div>';
      },
      wire: function(){
        var box = document.getElementById("ptable"), filt = document.getElementById("lookup");
        function paint(){
          var f = filt.value.trim().toLowerCase();
          box.innerHTML = ELS.filter(function(e){
            return !f || e.sym.toLowerCase().indexOf(f) === 0 ||
                   e.name.toLowerCase().indexOf(f) > -1 || String(e.z) === f;
          }).map(function(e){
            return '<div class="el' + (e.sym.length===1 ? " one" : "") + '"><span class="z">' + e.z +
                   "</span><b>" + e.sym + "</b><i>" + esc(e.name) + "</i></div>";
          }).join("") || '<span class="empty">no element matches that</span>';
        }
        filt.addEventListener("input", paint); paint();
      }
    },
    {
      id: "p2",
      tab: "Play 2",
      name: "Round two",
      blurb: "A new rule. Everything you worked out in round one is worthless here.",
      sub: "Same picnic, new rule. Type what you'd like to bring.",
      ph: "a sandwich…",
      hardDesc: "No repeated letters — strictly increasing. Kills beer, eggs, moss, bill, door, floor, hills, cellos, chilly, glossy, billowy and accost, every one of which you have already approved. Note that hint 4 dies with them, so use host / ghost as the stuck-player pair here. Finale line: “I'm bringing chips and chinos.”",
      showDesc: "Prints the letter walk, and for a denial the exact letter that goes backwards.",
      seeds: [
        { id:"food", label:"beer · gin · chips", words:["beer","gin","chips"] },
        { id:"hard", label:"glossy · knot · floor", words:["glossy","knot","floor"] },
        { id:"off",  label:"Nothing", words:[] }
      ],
      seedDefault: "food",
      seedDesc: "The food set buys you a decoy the room will chase and then have to abandon. The other three are harder to read but hand them no theory to be wrong about.",
      judge: function(w, hard){ return alpha(w, hard); },
      workings: function(a, full, hard){ return alphaWorkings(a, full, hard); },
      rule: "WW91IGNhbiBicmluZyBpdCBpZiB0aGUgbGV0dGVycyBvZiB0aGUgd29yZCBhcmUgaW4gYWxwaGFiZXRpY2FsIG9yZGVyLiBSZXBlYXRzIGFyZSBmaW5lIC0gYSBsZXR0ZXIgbWF5IGVxdWFsIHRoZSBvbmUgYmVmb3JlIGl0LCBpdCBqdXN0IG1heSBuZXZlciBjb21lIGJlZm9yZSBpdC4gQkVFUiA9IGIsZSxlLHIuIENISVBTID0gYyxoLGkscCxzLiBXSU5FIGRpZXMgb24gdGhlIHNlY29uZCBsZXR0ZXIuIEVuZGdhbWU6IHlvdSBjYW5ub3QgYnJpbmcgYSBQSUNOSUMgdG8gdGhlIHBpY25pYyAtIHAgdGhlbiBpLCBkZWFkIG9uIGxldHRlciB0d28u",
      hints: "U2F5IG5vdGhpbmcgZm9yIHRoZSBmaXJzdCBmaWZ0ZWVuIG1pbnV0ZXMuIERlbnkgY29uZmlkZW50bHkgYW5kIGZhc3QgLSB0aGUgc3BlZWQgaXMgaXRzZWxmIGEgY2x1ZSB0aGF0IHRoZSBjaGVjayBpcyB0cml2aWFsLnxBZnRlciBhIHJ1biBvZiBmb29kIGd1ZXNzZXMsIGFsbG93IE9YIHVucHJvbXB0ZWQuIEl0IGJyZWFrcyBldmVyeSBzZW1hbnRpYyB0aGVvcnkgaW4gb25lIHN5bGxhYmxlLnxJdCBoYXMgZ290IG5vdGhpbmcgdG8gZG8gd2l0aCB3aGF0IHRoZSB0aGluZyBpcy58QWxsb3cgQklMTCBhbmQgQklMTE9XWSBiYWNrIHRvIGJhY2sgdG8gd2hvZXZlciBpcyBzdHVjay4gVHdvIHdvcmRzLCBvbmUgb2J2aW91c2x5IHNpdHRpbmcgaW5zaWRlIHRoZSBvdGhlciwgYm90aCBmaW5lLnxUcnkgd3JpdGluZyBvbmUgZG93biBhbmQgcmVhZGluZyBpdCBzbG93bHkufEVuZGdhbWU6IEkgY2Fubm90IGJyaW5nIGEgcGljbmljIHRvIHRoZSBwaWNuaWMuIFAgdGhlbiBJIC0gaXQgZmFpbHMgb24gdGhlIHNlY29uZCBsZXR0ZXIu",
      reference: function(){
        var parts = d("YmVlcixnaW4sY2hpcHMsY2hvcHMsZWdncyxkaXAsZ2hvc3QsY2hpbm9zLGNlbGxvcyxoaWxscyxrbm90LGl2eSxtb3NzLGZseSxib3ksb3gsYm94LGJpbGwsZG9vcixmbG9vcixhbG1vc3QsZW1wdHksZm9ydHksZGlydHksY2hpbGx5LGdsb3NzeSxiaWxsb3d5LGNoaW50eixkZWZ0LGhvc3QsbG9zdCxtb3N0LGNvc3QsYWNjb3N0LGFkb3B0LG5vc3ksc3R5fndpbmUsdm9ka2EsY3Jpc3BzLG5hY2hvcyxzYWxhZCxjaGVlc2UsZnJ1aXQsanVpY2Usd2F0ZXIsYnJlYWQsbWFuZ28sYmFza2V0LGJsYW5rZXQsa25pZmUscGxhdGUsc3Bvb24sY3VwLGNhcixzdW4scGljbmljLGZpZ3M=").split("~");
        function chips(list, cls){
          return '<div class="chips">' + list.split(",").map(function(w){
            return '<span class="chip ' + cls + '">' + esc(w) + "</span>"; }).join("") + "</div>";
        }
        var art = ["a beer","a chip","a dip","an ox","a gin","a hill","a knot","an egg","egg"];
        return "<strong>Ruling live</strong> — walk left to right and ask “did I go backwards?”. " +
          "You never need this list; it is only for seeding and hints." +
          "<br><br><strong>Allowed</strong>" + chips(parts[0], "y") +
          "<strong>Denied</strong>" + chips(parts[1], "n") +
          '<small class="sub">figs sits in the denied column: f·i, then g comes before i.</small>' +
          "<br><br><strong>The article wrinkle</strong> — sometimes it rescues a word, sometimes it kills one, " +
          "and “an” is nearly always fatal." +
          '<div class="chips">' + art.map(function(p){
            var a = alpha(clean(p), false);
            return '<span class="chip ' + (a.ok ? "y" : "n") + '">' + esc(p) + " " + (a.ok ? "✓" : "✗") + "</span>";
          }).join("") + "</div>";
      },
      wire: function(){}
    }
  ];
  var BY = {}; PLAYS.forEach(function(p){ BY[p.id] = p; });

  /* =================================================================
     STATE + ROUTING
     ================================================================= */
  var cur = null;
  function load(p){
    var st = { hard:false, show:false, seed:p.seedDefault, touched:false, items:null };
    try { var raw = localStorage.getItem("cibi." + p.id);
          if (raw) st = Object.assign(st, JSON.parse(raw)); } catch(e){}
    if (!st.items){ st.items = seedWords(p, st.seed).slice(); st.touched = false; }
    return st;
  }
  function save(){ try { localStorage.setItem("cibi." + cur.id, JSON.stringify(cur.st)); } catch(e){} }
  function seedWords(p, id){
    var s = p.seeds.filter(function(x){ return x.id === id; })[0];
    return s ? s.words : [];
  }
  function judge(text){ return cur.judge(clean(text), cur.st.hard); }

  var home = document.getElementById("home"), game = document.getElementById("game");

  document.getElementById("playCards").innerHTML = PLAYS.map(function(p){
    return '<button class="play" data-go="' + p.id + '"><span class="tag">' + esc(p.tab) +
      '</span><div class="name">' + esc(p.name) + '</div><div class="desc">' + esc(p.blurb) +
      '</div><div class="go">Start &rarr;</div></button>';
  }).join("");
  document.getElementById("tabs").innerHTML = PLAYS.map(function(p){
    return '<button class="tab" role="tab" data-go="' + p.id + '">' + esc(p.tab) + "</button>";
  }).join("");
  document.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("[data-go]") : null;
    if (b) open(b.getAttribute("data-go"));
  });
  document.getElementById("backBtn").addEventListener("click", function(){
    game.hidden = true; home.hidden = false; window.scrollTo(0,0);
  });

  function open(id){
    var p = BY[id];
    cur = p; cur.st = load(p);
    home.hidden = true; game.hidden = false;
    document.getElementById("gTitle").textContent = p.name;
    document.getElementById("gSub").textContent = p.sub;
    document.getElementById("q").placeholder = p.ph;
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){
      t.setAttribute("aria-selected", t.getAttribute("data-go") === id ? "true" : "false");
    });
    idle(); draw(); window.scrollTo(0,0);
  }

  /* =================================================================
     BOARD
     ================================================================= */
  var verdict = document.getElementById("verdict"),
      listY = document.getElementById("listY"), listN = document.getElementById("listN"),
      cy = document.getElementById("cy"), cn = document.getElementById("cn");

  function idle(){
    verdict.className = "verdict";
    verdict.innerHTML = '<div class="idle">Nothing asked yet.</div>';
  }

  function draw(){
    var rows = cur.st.items.map(function(t){ return { text:t, a:judge(t) }; });
    var yes = rows.filter(function(r){ return r.a && r.a.ok; });
    var no  = rows.filter(function(r){ return r.a && !r.a.ok; });
    cy.textContent = yes.length ? "(" + yes.length + ")" : "";
    cn.textContent = no.length ? "(" + no.length + ")" : "";
    [[listY, yes], [listN, no]].forEach(function(pair){
      var el = pair[0], arr = pair[1];
      if (!arr.length){ el.innerHTML = '<li class="empty">nothing yet</li>'; return; }
      el.innerHTML = arr.slice().reverse().map(function(r){
        var how = cur.st.show
          ? '<span class="how">' + cur.workings(r.a, false, cur.st.hard) + "</span>" : "";
        return "<li>" + esc(r.text) + how + "</li>";
      }).join("");
    });
  }

  document.getElementById("f").addEventListener("submit", function(e){
    e.preventDefault();
    var q = document.getElementById("q");
    var text = q.value.trim().replace(/\s+/g, " ");
    if (!text) return;
    var a = judge(text);
    if (!a){
      verdict.className = "verdict";
      verdict.innerHTML = '<div class="idle">Try that again with some letters in it.</div>';
      q.value = ""; return;
    }
    verdict.className = "verdict pop " + (a.ok ? "yes" : "no");
    verdict.innerHTML =
      '<div class="big">' + (a.ok ? "YES" : "NO") + "</div>" +
      '<div class="line">You ' + (a.ok ? "can" : "can't") + " bring <strong>" + esc(text) + "</strong>.</div>" +
      (cur.st.show ? '<div class="split">' + cur.workings(a, true, cur.st.hard) + "</div>" : "");
    void verdict.offsetWidth;
    var norm = text.toLowerCase();
    if (!cur.st.items.some(function(t){ return t.toLowerCase() === norm; })){
      cur.st.items.push(text); cur.st.touched = true; save(); draw();
    }
    q.value = ""; q.blur();
  });

  /* =================================================================
     HOST PANEL
     ================================================================= */
  var panel = document.getElementById("hostPanel"),
      optShow = document.getElementById("optShow"),
      optHard = document.getElementById("optHard"),
      optSeed = document.getElementById("optSeed"),
      spoiler = document.getElementById("spoiler");

  document.getElementById("hostBtn").addEventListener("click", function(){
    document.getElementById("hpWhich").textContent = "· " + cur.name.toLowerCase();
    document.getElementById("showDesc").textContent = cur.showDesc + " Host eyes only.";
    document.getElementById("hardDesc").textContent = cur.hardDesc + " Flipping this re-judges the whole board.";
    document.getElementById("seedDesc").textContent = cur.seedDesc;
    optShow.checked = cur.st.show; optHard.checked = cur.st.hard;
    optSeed.innerHTML = cur.seeds.map(function(s){
      return '<option value="' + s.id + '"' + (s.id === cur.st.seed ? " selected" : "") + ">" +
             esc(s.label) + "</option>"; }).join("");
    spoiler.hidden = true;
    panel.showModal();
  });
  document.getElementById("closeBtn").addEventListener("click", function(){ panel.close(); });

  optShow.addEventListener("change", function(){ cur.st.show = optShow.checked; save(); draw(); });
  optHard.addEventListener("change", function(){ cur.st.hard = optHard.checked; save(); draw(); });
  optSeed.addEventListener("change", function(){
    cur.st.seed = optSeed.value;
    // Swap the opening board straight away if nobody has played yet;
    // otherwise it takes effect on the next Clear board.
    if (!cur.st.touched){ cur.st.items = seedWords(cur, cur.st.seed).slice(); draw(); }
    save();
  });
  document.getElementById("resetBtn").addEventListener("click", function(){
    cur.st.items = seedWords(cur, cur.st.seed).slice();
    cur.st.touched = false; save(); draw(); idle();
  });

  document.getElementById("revealBtn").addEventListener("click", function(){
    spoiler.innerHTML =
      "<strong>The rule.</strong> " + esc(d(cur.rule)) +
      "<br><br><strong>Hint ladder</strong> (nothing for the first fifteen minutes)<ol>" +
      d(cur.hints).split("|").map(function(h){ return "<li>" + esc(h) + "</li>"; }).join("") +
      "</ol><br>" + cur.reference();
    spoiler.hidden = false;
    cur.wire();
  });
})();
</script>
